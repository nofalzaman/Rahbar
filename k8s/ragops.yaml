apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  namespace: rahbar
spec:
  selector:
    app: api-candidate
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ragops-internal
  namespace: rahbar
spec:
  podSelector: &id001
    matchExpressions:
    - key: app
      operator: In
      values:
      - api
      - api-candidate
      - ragops-ingest
      - ragops-eval
      - data-shell
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: *id001
  egress:
  - to:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - api
          - api-candidate
          - chroma
          - redis
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - ipBlock:
        cidr: 192.168.65.254/32
    ports:
    - protocol: TCP
      port: 11434
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ragops-store-ingress
  namespace: rahbar
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - chroma
      - redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - api
          - api-candidate
          - ragops-ingest
          - ragops-eval
          - data-shell
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 6379
