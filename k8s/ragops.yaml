apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ragops-data
  namespace: rahbar
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ragops-thresholds
  namespace: rahbar
data:
  thresholds.json: "{\n  \"recall@5\": {\n    \"max_drop\": 0.02\n  },\n  \"faithfulness_proxy\"\
    : {\n    \"min\": 0.8\n  },\n  \"latency_p95_seconds\": {\n    \"max\": 15\n \
    \ },\n  \"abstention_correctness\": {\n    \"max_drop\": 0\n  },\n  \"citation_validity\"\
    : {\n    \"min\": 0.95\n  },\n  \"answerable_answer_rate\": {\n    \"max_drop\"\
    : 0\n  }\n}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-shell
  namespace: rahbar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-shell
  template:
    metadata:
      labels:
        app: data-shell
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: data-shell
        image: rahbar-indexer:a3-r4
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -c
        - import time; time.sleep(864000)
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ragops-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rahbar
  labels:
    app: api
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
      - name: api
        image: rahbar-api:a3-r4
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: rahbar-config
        env:
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: rahbar-secret
              key: LLM_API_KEY
              optional: true
        - name: CHROMA_COLLECTION
          value: rahbar-a3-baseline
        - name: TOP_K
          value: '5'
        - name: TEMPERATURE
          value: '0'
        - name: TRACE_DIR
          value: /data/traces
        - name: SEED
          value: '42'
        - name: LLM_TIMEOUT_SECONDS
          value: '120'
        - name: RELEASE_IMAGE
          value: rahbar-api:a3-r4
        - name: EMBED_VERSION
          value: 0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f
        - name: LLM_VERSION
          value: a80c4f17acd55265feec403c7aef86be0c25983ab279d83f3bcd3abbcb5b8b72
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          failureThreshold: 30
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command:
              - sleep
              - '5'
        resources:
          requests:
            cpu: 100m
            memory: 160Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: ragops-data
---
