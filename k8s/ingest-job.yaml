apiVersion: batch/v1
kind: Job
metadata:
  name: ragops-ingest
  namespace: rahbar
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: ragops-ingest
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: ingest
        image: rahbar-indexer:a3-r5
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - pipeline.ragops
        envFrom:
        - configMapRef:
            name: rahbar-config
        env:
        - name: CORPUS_DIR
          value: /data/corpus/active
        - name: CHROMA_COLLECTION
          value: rahbar-a3-baseline
        resources:
          requests:
            cpu: 500m
            memory: 384Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: ragops-data
