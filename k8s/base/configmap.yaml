apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  RETRIEVER: "chroma"
  LLM_PROVIDER: "ollama-host"
  LLM_MODEL: "llama3.2:3b"
  # CPU generation is slow, so the call gets a generous timeout.
  LLM_TIMEOUT_SECONDS: "120"
  # The embedding pin. The api and the indexer both read these keys.
  EMBED_MODEL: "nomic-embed-text"
  EMBED_DOC_PREFIX: "search_document: "
  EMBED_QUERY_PREFIX: "search_query: "
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  HOSTED_BASE_URL: ""
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  TOP_K: "5"
  # 0.2: the answer must be factual and valid JSON, and low randomness keeps both stable.
  # Zero is not needed, and it would not fix a missing fact anyway.
  TEMPERATURE: "0.2"
  # Initial guesses, replaced by measured values in Phase 5.
  RELEVANCE_FLOOR: "0.35"
  CACHE_THRESHOLD: "0.92"
  REDIS_URL: "redis://redis:6379/0"